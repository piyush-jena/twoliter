set superusers=""
set check_signatures="no"
set default="0"
set timeout="0"
set dm_verity_root="root,,,ro,0 430080 verity 1 PARTUUID=$boot_uuid/PARTNROFF=1 PARTUUID=$boot_uuid/PARTNROFF=2 4096 4096 53760 1 sha256 5c5e27529db4ff63ebaba56fda4167bdf0a19e5eeec20d9b4efc7fffef4fd13e 0be911e033cb4ad31ef3216b52a7b12bdcdf4f3917f2db32bd5c485cfa8505fe 2 restart_on_corruption ignore_zero_blocks"

menuentry "Bottlerocket OS 1.67.0" --unrestricted {
   linux ($root)/vmlinuz \
       console=tty0 console=ttyS0,115200n8 crashkernel=2G-:256M net.ifnames=0 netdog.default-interface=eth0:dhcp4,dhcp6? quiet \
       bootconfig \
       root=/dev/dm-0 rootwait ro raid=noautodetect random.trust_cpu=on selinux=1 enforcing=1 \
       dm-mod.create="$dm_verity_root" \
       -- \
       systemd.log_target=journal-or-kmsg systemd.log_color=0 systemd.show_status=true
   initrd ($private)/bootconfig.data
   boot
      echo "rebooting in 30 seconds..."
   sleep 30
   reboot

}
